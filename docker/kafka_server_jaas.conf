// JAAS configuration for the Kafka broker's SASLSCRAM listener.
//
// The context name must match the listener name (lowercase) suffixed with
// .KafkaServer, per Kafka's JaasContext.loadServerContext() lookup order.
//
// No username/password here — SCRAM credentials are stored in KRaft metadata
// and created at runtime by kafka-configs.sh in setup.sh.
saslscram.KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};

# connections.toml — named Kafka cluster connections TEMPLATE
# ─────────────────────────────────────────────────────────────────────────────
# Place this file in the same directory as your .proj.toml file.
# Each [connection.<name>] section describes one named Kafka cluster.
#
# Fields per connection:
#   bootstrap  — Kafka bootstrap server(s), comma-separated (required)
#   topic      — event-log topic written by the KafkaSQL engine (required)
#   username   — SASL/SCRAM-SHA-256 username (optional)
#   password   — SASL/SCRAM-SHA-256 password (optional, required if username set)
#
# When username/password are set the client uses SASL_PLAINTEXT + SCRAM-SHA-256.
# Make sure bootstrap points at the SASL listener port (e.g. 9094), NOT the
# PLAINTEXT port (e.g. 9092) — connecting with SASL to a PLAINTEXT listener
# causes an "unexpected handshake" error.
#
# Connections are shown as child nodes under the project in the VS Code
# project explorer. Expanding a connection reads the live schema model
# directly from the configured Kafka cluster.
# ─────────────────────────────────────────────────────────────────────────────


# ── Local / development cluster (no auth, PLAINTEXT port) ────────────────────

[connection.local]
bootstrap = "localhost:9092"
topic     = "_kafkasql_log"

# ── Local / development cluster (SASL/SCRAM, port 9094) ──────────────────────
# Replace these placeholders with your own local credentials.
# Do not commit real secrets in this file.

[connection.local-admin]
bootstrap = "localhost:9094"
topic     = "_kafkasql_log"
username  = "<set-via-env-or-local-secret>"
password  = "<set-via-env-or-local-secret>"
